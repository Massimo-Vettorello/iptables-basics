# Lab iptables: 1 server (firewall) + 2 client on isolated network.
# Start:  docker compose up -d --build
services:
  server:
    build: ./server
    container_name: fw-server
    hostname: fw-server
    cap_add:
      - NET_ADMIN        # necessary to use IPTABLES
    networks:
      lab:
        ipv4_address: 172.28.0.10

  client1:
    build: ./client
    container_name: fw-client1
    hostname: client1
    cap_add:
      - NET_RAW          # for ping/nmap
    networks:
      lab:
        ipv4_address: 172.28.0.21

  client2:
    build: ./client
    container_name: fw-client2
    hostname: client2
    cap_add:
      - NET_RAW
    networks:
      lab:
        ipv4_address: 172.28.0.22

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
